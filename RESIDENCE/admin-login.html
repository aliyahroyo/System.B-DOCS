
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Login | RESIDENCE</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="admin-login-container">

        <div class="admin-login-logo">R</div>

        <h1>RESIDENCE</h1>
        <p class="admin-login-subtitle">BARANGAY ADMIN PORTAL</p>

        <section class="admin-login-card">
            <h2>Staff Login</h2>
            <p>Sign in to manage resident document requests.</p>

           <form id="adminLoginForm" autocomplete="off">

              <label for="adminEmail">Email Address</label>
<input
    type="email"
    id="adminEmail"
    placeholder="staff@barangay.gov.ph"
    autocomplete="off"
    required

                >

                <label for="adminPassword">Password</label>

              <div class="admin-password-wrapper">
    <input
        type="password"
        id="adminPassword"
        placeholder="Enter your password"
        autocomplete="current-password"
        required
    >
    <button type="button" id="adminTogglePassword">
        Show
    </button>
</div>

                <a href="#" id="adminForgotPassword">
                    Forgot Password?
                </a>
                <p id="adminLoginError" class="error-message"></p>

                <button type="submit" class="admin-login-button">
                    STAFF LOGIN
                </button>

            </form>
        </section>

        <p class="admin-login-footer">
            RESIDENCE Barangay Management System
        </p>

        <a href="index.html" class="resident-login-link login-switch-link">
            ← Back to Resident Login
        </a>

        <a href="admin-signup.html" class="resident-login-link">
    Not registered? Apply for Staff Account
</a>

    </main>

    <script src="script.js"></script>
</body>
</html>
